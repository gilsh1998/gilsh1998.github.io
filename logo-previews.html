<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gil's Company — Final Logo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f5f5f5; padding: 40px; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 8px; color: #1a1a1a; }
    p.sub { text-align: center; color: #888; margin-bottom: 40px; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; max-width: 1000px; margin: 0 auto; }
    .card { background: #fff; border-radius: 16px; padding: 48px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card.dark { background: #111; }
    .card h2 { font-size: 0.9rem; color: #888; margin-top: 24px; }
    .logo-wrap { display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body>
  <h1>Gil's Company — Candlestick Logo</h1>
  <p class="sub">Japanese candlesticks going up, left to right. Three sizes shown.</p>

  <div class="grid">

    <!-- Full logo on white -->
    <div class="card">
      <div class="logo-wrap">
        <svg width="220" height="60" viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Candle 1: small bullish -->
          <line x1="6" y1="38" x2="6" y2="52" stroke="#2563eb" stroke-width="1.5"/>
          <rect x="2" y="40" width="8" height="8" rx="1" fill="#2563eb" opacity="0.4"/>
          <!-- Candle 2: medium bullish -->
          <line x1="20" y1="28" x2="20" y2="48" stroke="#2563eb" stroke-width="1.5"/>
          <rect x="16" y="32" width="8" height="12" rx="1" fill="#2563eb" opacity="0.6"/>
          <!-- Candle 3: tall bullish -->
          <line x1="34" y1="10" x2="34" y2="42" stroke="#2563eb" stroke-width="1.5"/>
          <rect x="30" y="16" width="8" height="20" rx="1" fill="#2563eb"/>
          <!-- Text -->
          <text x="54" y="32" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#1a1a1a">Gil's</text>
          <text x="54" y="50" font-family="Inter, sans-serif" font-weight="300" font-size="13" fill="#64748b" letter-spacing="3">COMPANY</text>
        </svg>
      </div>
      <h2>On white</h2>
    </div>

    <!-- Full logo on dark -->
    <div class="card dark">
      <div class="logo-wrap">
        <svg width="220" height="60" viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="6" y1="38" x2="6" y2="52" stroke="#60a5fa" stroke-width="1.5"/>
          <rect x="2" y="40" width="8" height="8" rx="1" fill="#60a5fa" opacity="0.4"/>
          <line x1="20" y1="28" x2="20" y2="48" stroke="#60a5fa" stroke-width="1.5"/>
          <rect x="16" y="32" width="8" height="12" rx="1" fill="#60a5fa" opacity="0.6"/>
          <line x1="34" y1="10" x2="34" y2="42" stroke="#60a5fa" stroke-width="1.5"/>
          <rect x="30" y="16" width="8" height="20" rx="1" fill="#60a5fa"/>
          <text x="54" y="32" font-family="Inter, sans-serif" font-weight="700" font-size="24" fill="#f0f4ff">Gil's</text>
          <text x="54" y="50" font-family="Inter, sans-serif" font-weight="300" font-size="13" fill="#94a3b8" letter-spacing="3">COMPANY</text>
        </svg>
      </div>
      <h2 style="color:#555;">On dark</h2>
    </div>

    <!-- Icon only on white -->
    <div class="card">
      <div class="logo-wrap">
        <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="12" y1="38" x2="12" y2="52" stroke="#2563eb" stroke-width="1.5"/>
          <rect x="8" y="40" width="8" height="8" rx="1" fill="#2563eb" opacity="0.4"/>
          <line x1="30" y1="24" x2="30" y2="48" stroke="#2563eb" stroke-width="1.5"/>
          <rect x="26" y="28" width="8" height="14" rx="1" fill="#2563eb" opacity="0.65"/>
          <line x1="48" y1="8" x2="48" y2="40" stroke="#2563eb" stroke-width="1.5"/>
          <rect x="44" y="14" width="8" height="20" rx="1" fill="#2563eb"/>
        </svg>
      </div>
      <h2>Icon only</h2>
    </div>

    <!-- Favicon size -->
    <div class="card">
      <div class="logo-wrap" style="gap:24px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <svg width="32" height="32" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="12" y1="38" x2="12" y2="52" stroke="#2563eb" stroke-width="2"/>
            <rect x="7" y="40" width="10" height="8" rx="1.5" fill="#2563eb" opacity="0.4"/>
            <line x1="30" y1="24" x2="30" y2="48" stroke="#2563eb" stroke-width="2"/>
            <rect x="25" y="28" width="10" height="14" rx="1.5" fill="#2563eb" opacity="0.65"/>
            <line x1="48" y1="8" x2="48" y2="40" stroke="#2563eb" stroke-width="2"/>
            <rect x="43" y="14" width="10" height="20" rx="1.5" fill="#2563eb"/>
          </svg>
          <span style="font-size:0.7rem;color:#aaa;">32px</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <svg width="16" height="16" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="12" y1="38" x2="12" y2="52" stroke="#2563eb" stroke-width="3"/>
            <rect x="6" y="40" width="12" height="8" rx="2" fill="#2563eb" opacity="0.4"/>
            <line x1="30" y1="24" x2="30" y2="48" stroke="#2563eb" stroke-width="3"/>
            <rect x="24" y="28" width="12" height="14" rx="2" fill="#2563eb" opacity="0.65"/>
            <line x1="48" y1="8" x2="48" y2="40" stroke="#2563eb" stroke-width="3"/>
            <rect x="42" y="14" width="12" height="20" rx="2" fill="#2563eb"/>
          </svg>
          <span style="font-size:0.7rem;color:#aaa;">16px</span>
        </div>
      </div>
      <h2>Favicon sizes</h2>
    </div>

    <!-- In-context: nav bar mockup -->
    <div class="card" style="grid-column: 1/-1;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border:1px solid #eee;border-radius:10px;max-width:600px;margin:0 auto;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="36" height="28" viewBox="0 0 220 60" fill="none">
            <line x1="6" y1="38" x2="6" y2="52" stroke="#2563eb" stroke-width="1.5"/>
            <rect x="2" y="40" width="8" height="8" rx="1" fill="#2563eb" opacity="0.4"/>
            <line x1="20" y1="28" x2="20" y2="48" stroke="#2563eb" stroke-width="1.5"/>
            <rect x="16" y="32" width="8" height="12" rx="1" fill="#2563eb" opacity="0.6"/>
            <line x1="34" y1="10" x2="34" y2="42" stroke="#2563eb" stroke-width="1.5"/>
            <rect x="30" y="16" width="8" height="20" rx="1" fill="#2563eb"/>
            <text x="54" y="32" font-family="Inter" font-weight="700" font-size="24" fill="#1a1a1a">Gil's</text>
            <text x="54" y="50" font-family="Inter" font-weight="300" font-size="13" fill="#64748b" letter-spacing="3">COMPANY</text>
          </svg>
        </div>
        <div style="display:flex;gap:20px;font-size:0.85rem;color:#888;">
          <span>About</span><span>Team</span><span>Tech Stack</span><span style="color:#2563eb;">Contact</span>
        </div>
      </div>
      <h2>In a navigation bar</h2>
    </div>

  </div>
</body>
</html>
