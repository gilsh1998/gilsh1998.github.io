<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gil's Company — Logo v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f5f5f5; padding: 40px; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 8px; color: #1a1a1a; }
    p.sub { text-align: center; color: #888; margin-bottom: 40px; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; max-width: 1000px; margin: 0 auto; }
    .card { background: #fff; border-radius: 16px; padding: 48px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card.dark { background: #111; }
    .card h2 { font-size: 0.9rem; color: #888; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>Gil's Company — Candlestick Letters Logo</h1>
  <p class="sub">The "I" and "L" in Gil's are Japanese candlesticks going up.</p>

  <div class="grid">

    <!-- Full logo on white -->
    <div class="card">
      <svg width="260" height="70" viewBox="0 0 260 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- G -->
        <text x="0" y="44" font-family="Inter, sans-serif" font-weight="700" font-size="38" fill="#1a1a1a">G</text>
        <!-- I = small candlestick -->
        <line x1="32" y1="10" x2="32" y2="48" stroke="#2563eb" stroke-width="1.8"/>
        <rect x="27" y="18" width="10" height="20" rx="1.5" fill="#2563eb" opacity="0.7"/>
        <!-- L = taller candlestick -->
        <line x1="50" y1="4" x2="50" y2="48" stroke="#2563eb" stroke-width="1.8"/>
        <rect x="45" y="10" width="10" height="28" rx="1.5" fill="#2563eb"/>
        <!-- 's -->
        <text x="58" y="44" font-family="Inter, sans-serif" font-weight="700" font-size="38" fill="#1a1a1a">'s</text>
        <!-- COMPANY -->
        <text x="2" y="62" font-family="Inter, sans-serif" font-weight="300" font-size="13" fill="#64748b" letter-spacing="5">COMPANY</text>
      </svg>
      <h2>On white</h2>
    </div>

    <!-- Full logo on dark -->
    <div class="card dark">
      <svg width="260" height="70" viewBox="0 0 260 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="44" font-family="Inter, sans-serif" font-weight="700" font-size="38" fill="#f0f4ff">G</text>
        <line x1="32" y1="10" x2="32" y2="48" stroke="#60a5fa" stroke-width="1.8"/>
        <rect x="27" y="18" width="10" height="20" rx="1.5" fill="#60a5fa" opacity="0.7"/>
        <line x1="50" y1="4" x2="50" y2="48" stroke="#60a5fa" stroke-width="1.8"/>
        <rect x="45" y="10" width="10" height="28" rx="1.5" fill="#60a5fa"/>
        <text x="58" y="44" font-family="Inter, sans-serif" font-weight="700" font-size="38" fill="#f0f4ff">'s</text>
        <text x="2" y="62" font-family="Inter, sans-serif" font-weight="300" font-size="13" fill="#94a3b8" letter-spacing="5">COMPANY</text>
      </svg>
      <h2 style="color:#555;">On dark</h2>
    </div>

    <!-- Compact / nav size on white -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border:1px solid #eee;border-radius:10px;">
        <svg width="120" height="32" viewBox="0 0 260 70" fill="none">
          <text x="0" y="44" font-family="Inter" font-weight="700" font-size="38" fill="#1a1a1a">G</text>
          <line x1="32" y1="10" x2="32" y2="48" stroke="#2563eb" stroke-width="1.8"/>
          <rect x="27" y="18" width="10" height="20" rx="1.5" fill="#2563eb" opacity="0.7"/>
          <line x1="50" y1="4" x2="50" y2="48" stroke="#2563eb" stroke-width="1.8"/>
          <rect x="45" y="10" width="10" height="28" rx="1.5" fill="#2563eb"/>
          <text x="58" y="44" font-family="Inter" font-weight="700" font-size="38" fill="#1a1a1a">'s</text>
          <text x="2" y="62" font-family="Inter" font-weight="300" font-size="13" fill="#64748b" letter-spacing="5">COMPANY</text>
        </svg>
        <div style="display:flex;gap:20px;font-size:0.85rem;color:#888;">
          <span>Team</span><span>Tech</span><span style="color:#2563eb;">Contact</span>
        </div>
      </div>
      <h2>In navigation</h2>
    </div>

    <!-- Icon only: just the candles -->
    <div class="card">
      <div style="display:flex;justify-content:center;gap:40px;align-items:flex-end;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Small candle (I) -->
            <line x1="14" y1="10" x2="14" y2="40" stroke="#2563eb" stroke-width="1.5"/>
            <rect x="10" y="16" width="8" height="16" rx="1.5" fill="#2563eb" opacity="0.7"/>
            <!-- Tall candle (L) -->
            <line x1="34" y1="4" x2="34" y2="40" stroke="#2563eb" stroke-width="1.5"/>
            <rect x="30" y="8" width="8" height="24" rx="1.5" fill="#2563eb"/>
          </svg>
          <span style="font-size:0.7rem;color:#aaa;">Icon (white)</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="background:#111;border-radius:8px;padding:8px;">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="14" y1="10" x2="14" y2="40" stroke="#60a5fa" stroke-width="1.5"/>
              <rect x="10" y="16" width="8" height="16" rx="1.5" fill="#60a5fa" opacity="0.7"/>
              <line x1="34" y1="4" x2="34" y2="40" stroke="#60a5fa" stroke-width="1.5"/>
              <rect x="30" y="8" width="8" height="24" rx="1.5" fill="#60a5fa"/>
            </svg>
          </div>
          <span style="font-size:0.7rem;color:#aaa;">Icon (dark)</span>
        </div>
      </div>
      <h2>Icon only — the two candles</h2>
    </div>

  </div>
</body>
</html>
